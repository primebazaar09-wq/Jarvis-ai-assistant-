
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR="."

          if ! find . -type f -name gradlew -print -quit | grep -q .; then
            mkdir -p extracted

            FOUND=false
            while IFS= read -r -d '' zipfile; do
              if unzip -Z1 "$zipfile" | grep -Eq '(^|/)gradlew$'; then
                echo "Extracting Android project: $zipfile"
                unzip -oq "$zipfile" -d extracted
                FOUND=true
                break
              fi
            done < <(find . -maxdepth 2 -type f -name '*.zip' -print0)

            if [ "$FOUND" != true ]; then
              echo "ERROR: No ZIP containing gradlew found."
              exit 1
            fi

            PROJECT_DIR=$(find extracted -type f -name gradlew -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: gradlew not found after extraction."
              exit 1
            fi
          else
            PROJECT_DIR=$(find . -type f -name gradlew -print -quit | xargs -r dirname)
          fi

          echo "Project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
