
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository for Gradle project..."

          PROJECT_DIR=""

          # First check whether the project is already extracted.
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW_PATH=$(find . -type f -name gradlew \
              -not -path './.git/*' -print -quit || true)

            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            fi
          fi

          # If no Gradle wrapper exists, extract the project ZIP.
          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p extracted

            ZIP_FOUND=false

            while IFS= read -r -d '' ZIP_FILE; do
              if unzip -Z1 "$ZIP_FILE" | grep -Eq '(^|/)gradlew$'; then
                echo "Extracting: $ZIP_FILE"
                unzip -oq "$ZIP_FILE" -d extracted
                ZIP_FOUND=true
                break
              fi
            done < <(find . -maxdepth 2 -type f \
              -name '*.zip' \
              -not -path './.git/*' \
              -print0)

            if [ "$ZIP_FOUND" != true ]; then
              echo "ERROR: No ZIP containing gradlew was found."
              exit 1
            fi

            GRADLEW_PATH=$(find extracted -type f \
              -name gradlew -print -quit || true)

            if [ -z "$GRADLEW_PATH" ]; then
              echo "ERROR: gradlew missing after extraction."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          fi

          echo "Detected project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -80
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder not found."
            find "$PROJECT_DIR" -maxdepth 3 -type d | head -50
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
