
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW_PATH=$(find . -type f -name gradlew \
              -not -path './.git/*' -print -quit || true)

            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p extracted
            ZIP_FOUND=false

            while IFS= read -r -d '' ZIP_FILE; do
              if unzip -Z1 "$ZIP_FILE" | grep -Eq '(^|/)gradlew$'; then
                echo "Extracting: $ZIP_FILE"
                unzip -oq "$ZIP_FILE" -d extracted
                ZIP_FOUND=true
                break
              fi
            done < <(find . -maxdepth 2 -type f \
              -name '*.zip' -not -path './.git/*' -print0)

            if [ "$ZIP_FOUND" != true ]; then
              echo "ERROR: Android project ZIP not found."
              exit 1
            fi

            GRADLEW_PATH=$(find extracted -type f \
              -name gradlew -print -quit || true)

            if [ -z "$GRADLEW_PATH" ]; then
              echo "ERROR: gradlew not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          fi

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore
          echo "Debug keystore ready."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
